[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-schema-guard"
version = "0.1.0"
description = "Preview the impact of Pydantic model changes on MongoDB documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "pymongo>=4.7,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
pretty = ["rich>=13.7,<15"]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[project.scripts]
schema-guard = "schema_guard.cli:main"
schema-guard-server = "schema_guard.server:main"

[tool.setuptools.packages.find]
include = ["schema_guard*"]
